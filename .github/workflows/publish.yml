
name: Publish company skills

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "pixi.toml"
      - ".github/workflows/publish.yml"

  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "pixi.toml"
      - ".github/workflows/publish.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate recipes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          run-install: false
          cache: false

      - name: Install dependencies
        run: pixi install --verbose

      - name: Build all recipes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          recipes=(recipes/*/recipe.yaml)

          if (( ${#recipes[@]} == 0 )); then
            echo "::error::No recipes found"
            exit 1
          fi

          for recipe in "${recipes[@]}"; do
            echo "::group::Building ${recipe}"
            pixi run rattler-build build --recipe "$recipe"
            echo "::endgroup::"
          done

  publish:
    name: Publish packages to Cloudflare R2
    needs: validate

    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest
    environment: r2-dev

    concurrency:
      group: company-skills-r2-publish
      cancel-in-progress: false

    env:
      S3_BUCKET: ${{ vars.R2_BUCKET }}
      S3_ENDPOINT_URL: ${{ vars.R2_ENDPOINT }}
      S3_REGION: auto
      S3_ADDRESSING_STYLE: path

      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          run-install: false
          cache: false

      - name: Install dependencies
        run: pixi install --verbose

      - name: Verify R2 configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${S3_BUCKET:?Missing R2_BUCKET}"
          : "${S3_ENDPOINT_URL:?Missing R2_ENDPOINT}"
          : "${R2_ACCESS_KEY_ID:?Missing R2_ACCESS_KEY_ID}"
          : "${R2_SECRET_ACCESS_KEY:?Missing R2_SECRET_ACCESS_KEY}"

          echo "R2 configuration is present."
          echo "Target bucket: ${S3_BUCKET}"

      - name: Configure Rattler authentication
        shell: bash
        run: |
          set -euo pipefail

          AUTH_FILE="$RUNNER_TEMP/rattler-auth.json"

          python - <<'PY'
          import json
          import os

          auth = {
              "s3://skill-publish/conda": {
                  "S3Credentials": {
                      "access_key_id": os.environ["R2_ACCESS_KEY_ID"],
                      "secret_access_key": os.environ["R2_SECRET_ACCESS_KEY"],
                      "session_token": None
                  }
              }
          }

          path = os.path.join(os.environ["RUNNER_TEMP"], "rattler-auth.json")
          with open(path, "w") as f:
              json.dump(auth, f)

          os.chmod(path, 0o600)
          PY

          echo "RATTLER_AUTH_FILE=$AUTH_FILE" >> "$GITHUB_ENV"

      - name: Show rattler-build version
        run: pixi run rattler-build --version

      - name: Publish all skill recipes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          recipes=(recipes/*/recipe.yaml)

          if (( ${#recipes[@]} == 0 )); then
            echo "::error::No recipes found"
            exit 1
          fi

          for recipe in "${recipes[@]}"; do
            echo "::group::Publishing ${recipe}"

            pixi run rattler-build publish "$recipe" \
              --to "s3://${S3_BUCKET}/conda"

            echo "::endgroup::"
          done

      - name: Publishing completed
        run: echo "All skill packages were published successfully."
