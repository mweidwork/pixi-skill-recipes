
name: Publish company skills

on:
  pull_request:
    branches: [main]
    paths:
      - "recipes/**"
      - "pixi.toml"
      - ".github/workflows/publish.yml"

  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "pixi.toml"
      - ".github/workflows/publish.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate recipes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          run-install: false
          cache: false

      - name: Install dependencies
        run: pixi install --verbose

      - name: Build and validate all recipes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          recipes=(recipes/*/recipe.yaml)

          if (( ${#recipes[@]} == 0 )); then
            echo "::error::No recipes found"
            exit 1
          fi

          for recipe in "${recipes[@]}"; do
            echo "::group::Building ${recipe}"
            pixi run rattler-build build \
              --recipe "$recipe" \
              --output-dir validation-output
            echo "::endgroup::"
          done

  publish:
    name: Build and upload Conda channel to Cloudflare R2
    needs: validate

    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest
    environment: r2-dev

    concurrency:
      group: company-skills-r2-publish
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          run-install: false
          cache: false

      - name: Install dependencies
        run: pixi install --verbose

      - name: Build all packages into Conda channel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          recipes=(recipes/*/recipe.yaml)

          if (( ${#recipes[@]} == 0 )); then
            echo "::error::No recipes found"
            exit 1
          fi

          for recipe in "${recipes[@]}"; do
            echo "::group::Building ${recipe}"

            pixi run rattler-build build \
              --recipe "$recipe" \
              --output-dir channel

            echo "::endgroup::"
          done

          echo "Generated channel contents:"
          find channel -maxdepth 3 -type f | sort

          if [[ ! -f channel/noarch/repodata.json ]]; then
            echo "::error::Missing channel/noarch/repodata.json"
            exit 1
          fi

      - name: Upload built channel artifact
        uses: actions/upload-artifact@v4
        with:
          name: conda-channel
          path: channel
          if-no-files-found: error

      - name: Upload Conda channel to Cloudflare R2
        uses: ryand56/r2-upload-action@v1.5
        with:
          r2-account-id: b9296accc515e61268cbc93ac4377240
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.R2_BUCKET }}
          r2-jurisdiction: eu
          source-dir: channel
          destination-dir: conda
          keep-file-fresh: true
          output-file-url: false

      - name: Publishing completed
        run: echo "Conda channel uploaded successfully to Cloudflare R2."

  publish-github:
    name: Publish Conda channel to GitHub Pages
    needs: publish

    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: company-skills-github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}conda

    steps:
      - name: Download built channel
        uses: actions/download-artifact@v4
        with:
          name: conda-channel
          path: pages/conda

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy Conda channel to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publishing completed
        run: echo "Conda channel available at ${{ steps.deployment.outputs.page_url }}conda"
