context:
  skill: python-development

package:
  name: agent-skill-${{ skill }}
  version: "0.1.1"

source:
  path: .

build:
  noarch: generic
  script:
    - mkdir -p "${PREFIX}/share/agent-skills/${{ skill }}"
    - cp "${RECIPE_DIR}/SKILL.md" "${PREFIX}/share/agent-skills/${{ skill }}/SKILL.md"

tests:
  - package_contents:
      files:
        - share/agent-skills/python-development/SKILL.md

about:
  summary: Python development guidelines for AI coding agents
  license: MIT