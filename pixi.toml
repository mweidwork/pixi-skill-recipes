[workspace]
name = "pixi-skill-recipes"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
rattler-build = ">=0.69,<0.70"

[tasks.validate]
cmd = "rattler-build"
args = ["build", "recipes/python-development/recipe.yaml"]

[tasks.validate-all]
cmd = "rattler-build"
args = ["build", "--recipe-dir", "recipes"]
