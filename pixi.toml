[workspace]
name = "pixi-skill-recipes"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11"
rattler-build = ">=0.69,<0.70"
rattler-index = ">=0.34,<0.35"

[pypi-dependencies]
pixi-skill-recipes = { path = ".", editable = true }
boto3-stubs = { version = ">=1.34", extras = ["s3"] }
mypy = ">=1.11"
pre-commit = ">=3.7"
pytest = ">=8"
ruff = ">=0.6"

[tasks]
skills = "pixi-skill-recipes"
test = "pytest -q"
lint = "ruff check pixi_skill_recipes tests"
format = "ruff format pixi_skill_recipes tests"
typecheck = "mypy pixi_skill_recipes"
pre-commit = "pre-commit run --all-files"
